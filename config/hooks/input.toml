# Converts the platform-specific value stored in tBufKeyData.wPlatformKey
# to a platform-agnostic one, which is then written to tBufKeyData.eKey.
[[midasm_hook]]
address = 0x8233FCB0
name = "HydraHook_InputPlatformKeyConvert"
registers = ["r3"]
after_instruction = false
return = true

# Hooks InputUpdate where we can push input events via InputBufferInput().
[[midasm_hook]]
address = 0x82340490
name = "HydraHook_InputUpdate"
registers = []
after_instruction = false
return_on_true = true

# CPlayerUtilGetTarget has an early out on consoles that needs to be adjusted for PC input to work.
[[midasm_hook]]
address = 0x825717F0
name = "HydraHook_CPlayerUtilGetTarget"
registers = ["r3", "r4", "r5", "r6", "r7", "r8"]
after_instruction = false
