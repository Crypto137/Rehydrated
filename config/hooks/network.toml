# PartyCanStartGame controls availability of the start game button in the main menu.
[[midasm_hook]]
address = 0x823418A0
name = "HydraHook_Console_Online_PartyCanStartGame"
registers = ["r3"]
after_instruction = false
return_on_false = true

# ClientMessageReceiveAllMessage handles server messages as soon as they arrive to the client.
# Most messages are queued to be processed on the game thread later in ClientMessageReceiveGameMessage.
[[midasm_hook]]
address = 0x825AE110
name = "HydraHook_ClientMessageReceiveAllMessage"
registers = ["r3"]
after_instruction = false

# ClientMessageReceiveGameMessage handles server messages on the game thread.
[[midasm_hook]]
address = 0x825AF388
name = "HydraHook_ClientMessageReceiveGameMessage"
registers = ["r3"]
after_instruction = false

# Hooks AppServerIdle after it calls XServerReadUpdate. This is where we can inject messages from the PC client.
[[midasm_hook]]
address = 0x828D49C8
name = "HydraHook_PostXServerReadUpdate"
registers = []
after_instruction = false

# ServerSendOutgoingMessagesForGameConnection encodes messages stored in
# tOutgoingPacketBufferList of a GameConnection and calls XServerSendBuffer
# to flush them to the bound socket. GameConnection ptr is the r3 argument.
[[midasm_hook]]
address = 0x829551E8
name = "HydraHook_ServerSendOutgoingMessagesForGameConnection"
registers = ["r3"]
after_instruction = false

# ServerEventReceive queues a received client message to be processed by a game instance.
[[midasm_hook]]
address = 0x82955468
name = "HydraHook_ServerEventReceive"
registers = ["r3", "r4"]
after_instruction = false
return_on_true = true

# XServerSendBuffer flushed encoded outgoing server messages to a socket.
# r3 = u32 idServerSocket, r4 = void* pMessage, r5 = u32 dwSize
[[midasm_hook]]
address = 0x829B7CA0
name = "HydraHook_XServerSendBuffer"
registers = ["r3", "r4", "r5"]
after_instruction = false
return_on_true = true

# XServerSocketDisconnect requests a server socket to be disconnected.
# The socket removal happens in XServerSocketFinishDisconnect, which may be deferred.
[[midasm_hook]]
address = 0x829B8488
name = "HydraHook_XServerSocketDisconnect"
registers = ["r3", "r4"]
after_instruction = false

# Hooks XServerReadUpdate when a new connection is accepted.
[[midasm_hook]]
address = 0x829B8580
name = "HydraHook_XServerReadUpdate_OnJoined"
registers = ["r3"]
after_instruction = false

# ServerMessageReceiveOutsideGame handles client messages before they are passed
# to a game instance. In practice it handles only CMSG_JOIN_CONSOLE_GAME, but all client
# messages go through it first, and the rest are handled in ServerMessageReceive.
[[midasm_hook]]
address = 0x829E2C20
name = "HydraHook_ServerMessageReceiveOutsideGame"
registers = ["r3", "r4"]
after_instruction = false

# ServerMessageReceive handles client messages in the context of a specific game instance.
[[midasm_hook]]
address = 0x829E2DC0
name = "HydraHook_ServerMessageReceive"
registers = ["r3", "r4"]
after_instruction = false
